# Tests (Parsing ohne Browser, Popup mit geladener Extension in Chromium) und Abgleich mit den
# Schwesterprojekten bei jedem Push und Pull Request. Keine echten Websites, keine Zugangsdaten.
name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Chromium für Playwright
        run: npx playwright install --with-deps chromium

      # Die Extension braucht einen sichtbaren Browser (headless: false), deshalb ein virtuelles Display
      - name: Tests
        run: xvfb-run -a npm test

      - name: Ergebnisse bei Fehlern
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results
          retention-days: 7

  # Dienst-Erkennung gegen die Schwesterprojekte (abgleich/README.md im tracking-auditor). Eigener Job:
  # Bei einer Änderung über mehrere Repos ist er rot, bis alle nachgezogen sind; die Tests bleiben davon unberührt.
  abgleich:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: tracking-auditor (Stand des Standard-Branches)
        uses: actions/checkout@v7
        with:
          repository: mbaersch/tracking-auditor
          path: tracking-auditor
      - name: tracking-auditor-extension (Stand des Standard-Branches)
        uses: actions/checkout@v7
        with:
          repository: mbaersch/tracking-auditor-extension
          path: tracking-auditor-extension
      - name: Dieses Repo (ec-data-validator)
        uses: actions/checkout@v7
        with:
          path: ec-data-validator
      - name: stage-in-a-box (Stand des Standard-Branches)
        uses: actions/checkout@v7
        with:
          repository: mbaersch/stage-in-a-box
          path: stage-in-a-box

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Abgleich
        run: node tracking-auditor/abgleich/abgleich.js --extension tracking-auditor-extension --validator ec-data-validator --stage stage-in-a-box
